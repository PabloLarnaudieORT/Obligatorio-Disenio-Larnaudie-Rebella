<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Preparar una nueva batalla</title>
    <style>
        :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #183047;
            background: #f3f6f9;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 40px 20px;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 32px;
            border: 1px solid #d5dfe8;
            border-radius: 12px;
            background: white;
        }

        h1 {
            margin: 0 0 16px;
            font-size: clamp(1.6rem, 4vw, 2.1rem);
            line-height: 1.2;
        }

        p {
            line-height: 1.6;
            color: #445d73;
        }

        .tabla-contenedor {
            overflow-x: auto;
            margin-top: 24px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        caption {
            margin-bottom: 12px;
            text-align: left;
            font-size: 1.1rem;
            font-weight: bold;
        }

        th, td {
            padding: 16px;
            border-bottom: 1px solid #d5dfe8;
        }

        th { background: #edf3f8; }

        @media (max-width: 600px) {
            body { padding: 20px 12px; }
            main { padding: 20px 16px; }
            th, td { padding: 12px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Preparar una nueva batalla</h1>
        <p>Definí la composición de tu flota. Ambos jugadores utilizarán la misma cantidad de barcos de cada tipo.</p>

        <div class="tabla-contenedor">
            <table>
                <caption>Composición de la flota</caption>
                <thead>
                    <tr>
                        <th scope="col">Tipo de barco</th>
                        <th scope="col">Tamaño</th>
                        <th scope="col">Cantidad</th>
                    </tr>
                </thead>
                <!-- El presentador enviará los tipos; el manejador de la vista creará las filas. -->
                <tbody id="tiposBarco"></tbody>
            </table>
        </div>
    </main>
</body>
</html>
